name: Validate Swasthya

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check proximity-health.js
          node --check weather-alerts.js
          node --check dashboard.js
          node --check wearable-bridge.js

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/fetch_public_health.py
          python -m py_compile scripts/fetch_hpsc_wastewater.py
          python -m py_compile scripts/fetch_us_wastewater.py
          python -m py_compile scripts/fetch_ukhsa.py
          python -m py_compile scripts/fetch_weather_alerts.py

      - name: Validate public JSON
        run: |
          python -m json.tool data/public-health.json > /dev/null
          python -m json.tool data/ie-wastewater.json > /dev/null
          python -m json.tool data/us-wastewater.json > /dev/null
          python -m json.tool data/ukhsa-health.json > /dev/null
          python -m json.tool data/weather-alerts.json > /dev/null
          python -m json.tool data/country-health-providers.json > /dev/null
          python -m json.tool docs/wearable-summary.schema.json > /dev/null
          python -m json.tool examples/wearable-snapshot.example.json > /dev/null

  android-companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile Android companion
        run: gradle -p android/health-connect-companion :app:assembleDebug --stacktrace
